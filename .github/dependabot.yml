---
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
    commit-message:
      prefix: "fix(deps)"
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
    commit-message:
      prefix: "ci(deps)"
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action/*"
      cache:
        patterns:
          - "actions/cache/*"
      per-dependency:
        group-by: dependency-name
        patterns:
          - "*"
