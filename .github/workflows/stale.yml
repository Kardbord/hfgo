---
name: Close Stale Issues and PRs
on:
  schedule:
    - cron: "42 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Close stale issues/PRs
    runs-on: ubuntu-latest
    steps:
      - name: Close stale issues and PRs
        uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          stale-issue-message: >
            This issue has been inactive for one year. Stale issues will be
            closed automatically. If this is still relevant, please comment
            to keep it open.
          stale-pr-message: >
            This pull request has been inactive for one year. Stale PRs will
            be closed automatically. If this is still relevant, please
            comment to keep it open.
          days-before-stale: 365
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
