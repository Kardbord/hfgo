---
name: Fuzz Tests

on:
  push:
    branches:
      - main
      - v*-draft
  pull_request:
    branches:
      - main
      - v*-draft
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz-tests:
    name: Fuzz Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Run fuzz tests
        run: |
          set -e
          FUZZ_TIME="${{ github.event_name == 'schedule' && '30s' || '10s' }}"
          find . -name '*_fuzz_test.go' -exec dirname {} \; | sort -u | while read -r dir; do
            pkg=$(go list -f '{{.ImportPath}}' "$dir" 2>/dev/null)
            [ -z "$pkg" ] && continue
            go test -list '^Fuzz' "$pkg" 2>/dev/null | grep '^Fuzz' | while read -r target; do
              go test -run=^$ -fuzz="^${target}$" -fuzztime="$FUZZ_TIME" -timeout=120s -count=1 "$pkg"
            done
          done
