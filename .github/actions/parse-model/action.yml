name: Parse model from comment
description: >
  Resolve an opencode model from a comment body against an allowlist, falling back to a default when none is requested or the requested model is not allowed. Centralizes the allowlist so it is maintained in one place.

inputs:
  body:
    description: The comment body to parse.
    required: true
outputs:
  model:
    description: The resolved model (requested allowed model, or the default).
    value: ${{ steps.resolve.outputs.model }}
runs:
  using: composite
  steps:
    - name: Resolve model
      id: resolve
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        # A composite action's input is not visible to nested actions unless
        # propagated via with:/env; pass the body through explicitly via env.
        BODY: ${{ inputs.body }}
      with:
        script: |
          const ALLOWED_MODELS = [
            'openrouter/google/gemini-3.5-flash-lite',
            'openrouter/google/gemma-4-31b-it',
            'openrouter/inclusionai/ling-3.1-flash',
            'openrouter/minimax/minimax-m3',
            'openrouter/moonshotai/kimi-k2.6',
            'openrouter/moonshotai/kimi-k2.7-code',
            'openrouter/openrouter/free',
            'openrouter/qwen/qwen3.8-flash',
            'openrouter/qwen/qwen3.8-omni-flash',
            'openrouter/xiaomi/mimo-v2.6-pro',
            'openrouter/~deepseek/deepseek-flash-latest',
            'openrouter/~deepseek/deepseek-pro-latest',
            'openrouter/~moonshotai/kimi-latest',
            'openrouter/~z-ai/glm-flash-latest',
          ];
          const DEFAULT_MODEL = 'openrouter/moonshotai/kimi-k2.6';
          const body = process.env.BODY || '';
          const match = body.match(/^\/(?:review|opencode|oc)\s+model=(\S+)/);
          const requested = match ? match[1] : '';
          core.setOutput('model', ALLOWED_MODELS.includes(requested) ? requested : DEFAULT_MODEL);
