---
name: Run OpenCode
description: >
  Check out the repository (without persisting credentials) and run the OpenCode
  GitHub action. Centralizes the pinned opencode action, the OPENROUTER_API_KEY
  wiring, and the checkout configuration so they are maintained in one place.
inputs:
  openrouter_api_key:
    description: OpenRouter API key used to authenticate OpenCode.
    required: true
  model:
    description: Model to run OpenCode with.
    required: true
  prompt:
    description: Optional prompt to pass to OpenCode.
    required: false
    default: ""
  agent:
    description: Optional OpenCode agent to use.
    required: false
    default: ""
  share:
    description: Whether to share the OpenCode session.
    required: false
    default: "false"
  use_github_token:
    description: >
      Use the workflow's GITHUB_TOKEN instead of the OpenCode App token
      exchange. When true, the effective permissions are scoped to the
      calling workflow's `permissions` block.
    required: false
    default: "false"
  github_token:
    description: GITHUB_TOKEN to use when use_github_token is true.
    required: false
    default: ""
  config_content:
    description: Optional inline OPENCODE_CONFIG_CONTENT JSON.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Run OpenCode
      uses: anomalyco/opencode/github@53d1eabb61e21162157817bf677da0a4ad3332e3 # v1.18.35
      env:
        OPENROUTER_API_KEY: ${{ inputs.openrouter_api_key }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        OPENCODE_CONFIG_CONTENT: ${{ inputs.config_content }}
      with:
        model: ${{ inputs.model }}
        share: ${{ inputs.share }}
        agent: ${{ inputs.agent }}
        prompt: ${{ inputs.prompt }}
        use_github_token: ${{ inputs.use_github_token }}
